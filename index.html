<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess — Study Hall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<!-- Chess libraries & real-time sync -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<div class="app">
  <header>
    <h1>Study Hall <span>Chess</span></h1>
    <div style="display: flex; align-items: center; gap: 16px;">
      <button class="theme-toggle" id="themeToggleBtn" aria-label="Toggle theme" title="Toggle Theme">
        <svg class="theme-icon sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <svg class="theme-icon moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" style="display: none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
      <div class="tag" id="gameModeTag">two-player · local board</div>
    </div>
  </header>

  <div class="layout">
    <div class="board-wrap">
      <div class="status-bar">
        <div><span class="turn-dot white" id="turnDot"></span><span id="turnLabel">White to move</span></div>
        
        <!-- Turn Timers -->
        <div class="timer-container" id="timerContainer" style="display: flex;">
          <span id="whiteTimer" class="timer-badge white-timer active">02:00</span>
          <span class="timer-divider">:</span>
          <span id="blackTimer" class="timer-badge black-timer">02:00</span>
        </div>
        
        <div class="msg" id="statusMsg"></div>
      </div>

      <div class="frame">
        <div class="board" id="board"></div>
      </div>

      <div class="controls">
        <button class="btn primary" id="newGameBtn">New game</button>
        <button class="btn" id="undoBtn">Undo</button>
        <button class="btn" id="flipBtn">Flip board</button>
        <button class="btn danger" id="resignBtn" style="display: none;">Resign</button>
      </div>
    </div>

    <div class="panel">
      <!-- Game Mode Selection Card -->
      <div class="lobby-card">
        <h2>Game Mode</h2>
        <div class="lobby-toggle-group">
          <button class="lobby-tab active" id="modeLocalBtn">Local Play</button>
          <button class="lobby-tab" id="modeOnlineBtn">Online Play</button>
        </div>
        
        <!-- Online Lobby Panel -->
        <div class="lobby-online-section" id="lobbyOnlineSection" style="display: none;">
          <div class="lobby-actions" id="lobbySetupActions">
            <button class="btn primary btn-sm w-full" id="createRoomBtn">Create Private Room</button>
            <div class="lobby-divider">or</div>
            <div class="lobby-join-row">
              <input type="text" id="roomInput" placeholder="Enter Room ID..." aria-label="Room ID" maxlength="8">
              <button class="btn btn-sm" id="joinRoomBtn">Join</button>
            </div>
          </div>
          
          <div class="lobby-status" id="lobbyConnectedStatus" style="display: none;">
            <div class="lobby-status-indicator">
              <span class="pulse-dot" id="lobbyPulseDot"></span>
              <span id="connectionStatusText">Connecting...</span>
            </div>
            
            <div class="lobby-room-display" id="lobbyRoomDisplay" style="display: none;">
              <span class="room-label">Share Room ID / Link:</span>
              <div class="room-copy-box">
                <input type="text" id="roomLinkVal" readonly aria-label="Room Link">
                <button class="btn btn-icon" id="copyLinkBtn" title="Copy Room ID">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                </button>
              </div>
            </div>
            
            <button class="btn btn-sm danger w-full" id="disconnectBtn" style="margin-top: 10px;">Leave Room</button>
          </div>
        </div>
      </div>

      <div>
        <h2>Captured</h2>
        <div class="captured-row">
          <span class="label">White</span>
          <div class="captured-case" id="capByWhite"></div>
        </div>
        <div class="captured-row" style="margin-top:6px;">
          <span class="label">Black</span>
          <div class="captured-case" id="capByBlack"></div>
        </div>
      </div>

      <div>
        <h2>Move Log</h2>
        <div class="history">
          <table class="history-table">
            <tbody id="historyTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Pawn Promotion Modal -->
<div class="modal-backdrop" id="promoBackdrop">
  <div class="modal">
    <p>Promote pawn to</p>
    <div class="promo-options" id="promoOptions"></div>
  </div>
</div>

<!-- Game Over Modal -->
<div class="modal-backdrop" id="gameOverBackdrop">
  <div class="modal">
    <h2 id="gameOverTitle">Game Over</h2>
    <p id="gameOverText">Checkmate!</p>
    <button class="btn primary" id="gameOverCloseBtn">Play Again</button>
  </div>
</div>

<!-- Load order matters: board (data/constants) -> rules (move logic) -> ui (rendering + events) -->
<script src="js/board.js"></script>
<script src="js/rules.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
